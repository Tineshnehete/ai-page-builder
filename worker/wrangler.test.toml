name = "ai-page-builder-worker"
main = "src/index.ts"
compatibility_date = "2024-05-12"
compatibility_flags = ["nodejs_compat"]

# NOTE: AI binding is not available in test environment
# It's defined in wrangler.toml for production use

[vars]
SESSION_SECRET = "test-secret"
CF_API_TOKEN = "test-token"
CF_ACCOUNT_ID = "test-account"

# One Durable Object per user, storing that user's profile + projects.
[[durable_objects.bindings]]
name = "USER_DO"
class_name = "UserDO"

[[migrations]]
tag = "v1"
new_classes = ["UserDO"]
