name = "ai-page-builder-worker"
main = "src/index.ts"
compatibility_date = "2026-10-22"

# The app's own frontend (login/projects/editor UI in ../web) is served by
# this Worker as static assets, so UI and API share one origin: relative
# /api/* fetches hit this Worker and the SameSite=Lax session cookie just
# works, with no CORS. Requests that match a file in ../web are served
# directly; everything else (all /api/* routes) falls through to src/index.ts.
# web/.assetsignore keeps node_modules, package files and tests out of the
# upload. (Unrelated to per-user project publishing, which still creates a
# separate Cloudflare Pages project per user project via the Pages API.)
[assets]
directory = "../web"

# Workers AI binding, used for chat-driven HTML generation.
[ai]
binding = "AI"

# One Durable Object per user, storing that user's profile + projects.
[[durable_objects.bindings]]
name = "USER_DO"
class_name = "UserDO"

# A free-plan account can only use SQLite-backed Durable Objects, declared
# via new_sqlite_classes (not the legacy new_classes). The storage API
# (state.storage.get/put) is unchanged either way.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserDO"]

# Secrets (set with `wrangler secret put <NAME>`, not committed):
#   SESSION_SECRET      - HMAC key for signing session cookies
#   CF_API_TOKEN         - Cloudflare API token with Pages edit permission
#   CF_ACCOUNT_ID        - Cloudflare account id, for Pages API calls
