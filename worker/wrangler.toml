name = "ai-page-builder-worker"
main = "src/index.ts"
compatibility_date = "2026-10-22"

# Workers AI binding, used for chat-driven HTML generation.
[ai]
binding = "AI"

# One Durable Object per user, storing that user's profile + projects.
[[durable_objects.bindings]]
name = "USER_DO"
class_name = "UserDO"

[[migrations]]
tag = "v1"
new_classes = ["UserDO"]

# Secrets (set with `wrangler secret put <NAME>`, not committed):
#   SESSION_SECRET      - HMAC key for signing session cookies
#   CF_API_TOKEN         - Cloudflare API token with Pages edit permission
#   CF_ACCOUNT_ID        - Cloudflare account id, for Pages API calls
